name: Release

# Push a tag like v0.2.0 (scripts/release.sh does it) and this builds the
# Android APK and the iPad app, then drafts a GitHub release with both, to
# check and publish by hand.
#
# Secrets (Settings › Secrets and variables › Actions), see docs/releasing.md:
#   Android, required:  LINKCAM_KEYSTORE_BASE64, LINKCAM_KEYSTORE_PASSWORD,
#                       LINKCAM_KEY_ALIAS, LINKCAM_KEY_PASSWORD
#   iPad, optional:     APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64
#                       With these the build also goes to TestFlight; without
#                       them only the unsigned IPA is made, for sideloading.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Read and check the version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match VERSION (${version})"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "code=$(scripts/version-code.sh "${version}")" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LINKCAM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::LINKCAM_KEYSTORE_BASE64 isn't set, so the APK can't be signed. See docs/releasing.md."
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
      - name: Test and build
        env:
          LINKCAM_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          LINKCAM_KEYSTORE_PASSWORD: ${{ secrets.LINKCAM_KEYSTORE_PASSWORD }}
          LINKCAM_KEY_ALIAS: ${{ secrets.LINKCAM_KEY_ALIAS }}
          LINKCAM_KEY_PASSWORD: ${{ secrets.LINKCAM_KEY_PASSWORD }}
        run: ./gradlew :shared:jvmTest :android:app:assembleRelease
      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/LinkCam-${{ needs.version.outputs.version }}.apk"
          rm -f "${RUNNER_TEMP}/release.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  ipad:
    needs: version
    runs-on: macos-26
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          ios/generate.sh
      - name: Unsigned IPA, for sideloading
        run: |
          xcodebuild -project ios/LinkCam.xcodeproj -scheme LinkCam -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "${RUNNER_TEMP}/unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -n 40
          mkdir -p out Payload
          cp -R "${RUNNER_TEMP}/unsigned.xcarchive/Products/Applications/LinkCam.app" Payload/
          zip -qry "out/LinkCam-${VERSION}-unsigned.ipa" Payload
      - name: Signed build, to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "${APPLE_TEAM_ID}" ] || [ -z "${ASC_KEY_ID}" ] || [ -z "${ASC_ISSUER_ID}" ] || [ -z "${ASC_KEY_P8_BASE64}" ]; then
            echo "::notice::App Store Connect secrets aren't set: skipping TestFlight. See docs/releasing.md."
            exit 0
          fi
          key="${RUNNER_TEMP}/AuthKey_${ASC_KEY_ID}.p8"
          echo "${ASC_KEY_P8_BASE64}" | base64 --decode > "${key}"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "${key}" -authenticationKeyID "${ASC_KEY_ID}" -authenticationKeyIssuerID "${ASC_ISSUER_ID}")
          xcodebuild -project ios/LinkCam.xcodeproj -scheme LinkCam -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "${RUNNER_TEMP}/signed.xcarchive" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" CODE_SIGN_STYLE=Automatic "${auth[@]}" \
            archive | tail -n 40
          sed "s/TEAM_ID/${APPLE_TEAM_ID}/" ios/ExportOptions-TestFlight.plist > "${RUNNER_TEMP}/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "${RUNNER_TEMP}/signed.xcarchive" \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" -exportPath "${RUNNER_TEMP}/export" "${auth[@]}"
          rm -f "${key}"
      - uses: actions/upload-artifact@v7
        with:
          name: ipad
          path: out/*.ipa
          if-no-files-found: error

  publish:
    needs: [version, android, ipad]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* --repo "${GITHUB_REPOSITORY}" \
            --draft --generate-notes --title "Link Cam ${{ needs.version.outputs.version }}"
