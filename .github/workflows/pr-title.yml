name: PR title

# Pull requests are squash-merged, so the title becomes the commit, and
# release-please builds the version number and changelog from those commits.
# This checks that the title follows Conventional Commits:
#
#   feat: show the battery level of the camera       → next minor version
#   fix(usb): reconnect after the dongle resets      → next patch version
#   feat!: …  or a "BREAKING CHANGE:" footer         → next major version
#   docs: / refactor: / test: / build: / ci: / chore: → no release on their own

on:
  # pull_request_target, so it gets a token on pull requests from forks too.
  # It only reads the title and never checks out their code.
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            refactor
            test
            build
            ci
            chore
            style
          requireScope: false
