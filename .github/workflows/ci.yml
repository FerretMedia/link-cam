name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Shared tests
        run: ./gradlew :shared:jvmTest
      # The iPad app's half of the shared module compiles on Linux too, so a
      # change that breaks it shows up here without a Mac runner.
      - name: Shared module for iOS
        run: ./gradlew :shared:compileKotlinIosArm64
      - name: Build the app
        run: ./gradlew :android:app:assembleDebug
