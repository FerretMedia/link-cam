name: Dev build

# Every merge into dev builds "Link Cam Dev", a signed release build of the dev
# branch with its own app ID, and puts it on the "dev-build" pre-release. The
# link to the newest one never changes:
#
#   https://github.com/<owner>/<repo>/releases/download/dev-build/LinkCam-dev.apk
#
# It needs the same signing secrets as release.yml (docs/releasing.md).

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# A newer merge makes the build in progress pointless.
concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, to count commits and list them in the notes.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - id: v
        name: Version
        run: |
          count=$(git rev-list --count HEAD)
          short=$(git rev-parse --short=7 HEAD)
          echo "code=${count}" >> "$GITHUB_OUTPUT"
          echo "name=$(tr -d '[:space:]' < VERSION)+dev.${count}.${short}" >> "$GITHUB_OUTPUT"
          echo "short=${short}" >> "$GITHUB_OUTPUT"
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LINKCAM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::LINKCAM_KEYSTORE_BASE64 isn't set, so the APK can't be signed. See docs/releasing.md."
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
      - name: Test and build
        env:
          LINKCAM_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          LINKCAM_KEYSTORE_PASSWORD: ${{ secrets.LINKCAM_KEYSTORE_PASSWORD }}
          LINKCAM_KEY_ALIAS: ${{ secrets.LINKCAM_KEY_ALIAS }}
          LINKCAM_KEY_PASSWORD: ${{ secrets.LINKCAM_KEY_PASSWORD }}
          LINKCAM_VERSION_CODE: ${{ steps.v.outputs.code }}
          LINKCAM_VERSION_NAME: ${{ steps.v.outputs.name }}
        run: ./gradlew :shared:jvmTest :android:app:assembleDev
      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/dev/app-dev.apk out/LinkCam-dev.apk
          rm -f "${RUNNER_TEMP}/release.jks"
      # Every dev build also stays here for 30 days, for going back to one.
      - uses: actions/upload-artifact@v7
        with:
          name: LinkCam-dev-${{ steps.v.outputs.code }}-${{ steps.v.outputs.short }}
          path: out/LinkCam-dev.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish to the dev-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.v.outputs.name }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          {
            echo "**Link Cam Dev ${NAME}**, built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo "The newest build of the \`dev\` branch: what will be in the next release, not yet released. It installs next to the stable app, as *Link Cam Dev*, and updates itself over the previous dev build."
            echo
            echo "Download **LinkCam-dev.apk** below and open it on the phone. Android asks once to allow installs from the browser or file manager."
            echo
            if [ -n "$last" ]; then
              echo "### Merged since ${last}"
              git log --first-parent --no-merges --format='- %s' "${last}..HEAD" | head -n 50
            else
              echo "### Latest changes"
              git log --first-parent --no-merges --format='- %s' -n 30
            fi
          } > notes.md

          # Move the tag to this commit. It's dev-build, not dev, so it never
          # clashes with the branch name.
          git tag -f dev-build "${GITHUB_SHA}"
          git push -f origin refs/tags/dev-build

          if gh release view dev-build >/dev/null 2>&1; then
            gh release edit dev-build --prerelease --latest=false \
              --title "Dev build ${NAME}" --notes-file notes.md
            gh release upload dev-build out/LinkCam-dev.apk --clobber
          else
            gh release create dev-build out/LinkCam-dev.apk --prerelease --latest=false \
              --verify-tag --title "Dev build ${NAME}" --notes-file notes.md
          fi
